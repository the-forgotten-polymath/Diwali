<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diwali Animations - The Definitive Festive Effects Library</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">
</head>
<body>
  <div class="starry-sky"></div>

  <header>
    <div class="title-badge">✨ NPM: diwali-animations</div>
    <h1>Happy Diwali</h1>
    <div class="subtitle">Lightweight, 60 FPS, Zero-Dependency Canvas Animations</div>
  </header>

  <div class="side-panel">
    <button class="icon-btn" id="btn-sound" title="Toggle Procedural Audio">🔊</button>
    <button class="icon-btn" id="btn-sparkler-cursor" title="Toggle Phuljhadi Cursor Wand">🪄</button>
    <button class="icon-btn" id="btn-clear" title="Clear Canvas">🧹</button>
  </div>

  <div class="click-hint">
    ✨ Click or tap anywhere to launch crackers & fireworks!
  </div>

  <div class="control-dock">
    <button class="effect-btn" id="btn-diyas">🪔 Diyas</button>
    <button class="effect-btn" id="btn-rockets">🚀 Rockets</button>
    <button class="effect-btn" id="btn-chakri">🌀 Chakri</button>
    <button class="effect-btn" id="btn-anar">🏺 Anar</button>
    <button class="effect-btn" id="btn-phuljhadi">✨ Phuljhadi</button>
    <button class="effect-btn" id="btn-lanterns">🏮 Lanterns</button>
    <button class="effect-btn" id="btn-flowers">🌸 Flowers</button>
    <div class="divider"></div>
    <button class="effect-btn celebrate-btn" id="btn-celebrate">💥 Celebrate!</button>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
